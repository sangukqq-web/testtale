<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRISMA — 스토리 모드</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:DotGothic16,"Malgun Gothic","Apple SD Gothic Neo",monospace;color:#fff}
canvas{width:min(100vw,calc((100vh - 130px)*4/3));aspect-ratio:4/3;display:block;background:#000;outline:none}
#pad{display:none;gap:28px;align-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
#pad .d{display:grid;grid-template:repeat(2,44px)/repeat(3,44px);gap:4px}
#pad button{background:#000;color:#0ff;border:2px solid #0ff;font:inherit;font-size:18px;border-radius:0;padding:0}
#pad button:active{background:#0ff;color:#000}
#pad .ab button{width:64px;height:64px;margin:0 4px;font-size:22px}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}}
#hint{font-size:13px;color:#8a8a8a}
</style></head>
<body>
<canvas id="c" width="640" height="480" tabindex="0" aria-label="PRISMA 보스전"></canvas>
<div id="hint">방향키 이동 · Z / Enter 확인 · X 취소</div>
<div id="pad">
 <div class="d"><span></span><button data-k="ArrowUp">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>
 <div class="ab"><button data-k="x">X</button><button data-k="z">Z</button></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const F='DotGothic16,"Malgun Gothic","Apple SD Gothic Neo",monospace';
const keys={},pressed={};
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if(!keys[e.key])pressed[e.key]=1;keys[e.key]=1;ac()});
addEventListener('keyup',e=>keys[e.key]=0);
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(!keys[k])pressed[k]=1;keys[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>keys[k]=0))});
const hit=(...a)=>a.some(k=>pressed[k]),OK=()=>hit('z','Z','Enter',' '),NO=()=>hit('x','X','Escape');
let A;function ac(){try{if(!A)A=new(window.AudioContext||window.webkitAudioContext)();if(A.state==='suspended')A.resume()}catch(e){}}
function beep(f,d=.06,ty='square',v=.04,sl=0){if(!A)return;const o=A.createOscillator(),g=A.createGain(),n=A.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(A.destination);o.start(n);o.stop(n+d)}
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const hsl=(h,l=60,a=1)=>`hsla(${((h%360)+360)%360},100%,${l}%,${a})`;

let ban={t:0,s:''},CH=0,SC=null,choice=0,took=0,S='title',tm=0,P,E,menu=0,sub=false,subSel=0,Q=[],Qcb,T={s:'',i:0},fx,fb,B=[],LZ=[],PT=[],atk={},talk,dead={t:0},inv,shk=0,flash=0,hf=0,focus=0;
let box={x:40,y:250,w:560,h:140},heart={x:320,y:320};
const BX={x:40,y:250,w:560,h:140},AB={x:180,y:250,w:280,h:140},BC={x:320,y:125};
const FL=['프리즘의 빛이 눈을 찌른다.','공기가 지직거린다.','색이 점점 짙어지고 있다.','PRISMA가 당신을 내려다본다.','심장이 빠르게 뛴다.'];
const TK=[['어리석은 인간이여.','빛 앞에 무릎 꿇어라!'],['색이 갈라진다!','이건 시작일 뿐이다.'],['스펙트럼 전개!','피할 수 있을까?'],['모든 색을 쏟아붓겠다!','끝이다! 끝이다!!']];
const POOL=[[[0],[1],[2]],[[3],[2,0],[1]],[[4],[5],[1,3]],[[0,1],[2,4],[5,3],[1,2,4]]];
const phase=()=>{const r=E.hp/E.max;return E.k?(r>.75?0:r>.5?1:r>.25?2:3):(r>.5?0:1)};

function setT(s){T={s,i:0}}const tdone=()=>T.i>=T.s.length;
function say(l,cb){Q=l.slice();Qcb=cb;S='say';nextL()}
function nextL(){Q.length?setT('* '+Q.shift()):Qcb()}
function resetOld(){P={hp:40,max:40,inv:0};E={hp:420,max:420,turn:0,shake:0,ph:0,hpT:0,last:0,gone:0,show:0};menu=0;sub=false;B=[];LZ=[];PT=[];focus=0;
 inv=[{n:'무지개 젤리',h:20,c:3}];say(['빛의 군주 PRISMA가 모습을 드러냈다!','도망칠 곳은 없다.'],toMenu)}
function toMenu(){S='menu';sub=false;setT('* '+pick(FL))}
function enemyTurn(){S='talk';talk={t:0,s:pick((E.k?TK:TK0)[E.ph])}}
function startAtk(){S='attack';const pl=pick((E.k?POOL:POOL0)[E.ph]);atk={t:0,dur:7+E.ph*.6-(focus?2.5:0),ps:pl,s:{}};focus=0;B=[];LZ=[];heart.x=320;heart.y=320;E.turn++}
function burst(x,y,n,h0,sp=160){for(let i=0;i<n;i++){const a=rnd(0,6.283),v=rnd(.2,1)*sp;PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,h:h0+rnd(-40,40),l:rnd(.5,1.2)})}}
function hurt(){if(P.inv>0)return;P.hp-=4;took++;P.inv=.8;shk=.3;hf=.45;burst(heart.x,heart.y,26,0,240);ring(heart.x,heart.y,0,420,.4);hs=.09;zm=.05;noise(.2,.35);thud(90);beep(150,.2,'sawtooth',.08,-90);if(P.hp<=0){P.hp=0;S='dead';dead={t:0,x:heart.x,y:heart.y};beep(100,.6,'sawtooth',.09,-60)}}
function mk(x,y,vx,vy,r,h,o){B.push(Object.assign({x,y,vx,vy,r,h,life:12},o))}

function runPat(id,dt){const s=atk.s[id]||(atk.s[id]={c:0,a:0,n:0}),d=1+E.ph*.2,bx=box.x,by=box.y,bw=box.w,bh=box.h;s.c-=dt;
 if(id===0&&s.c<=0){s.c=.95/d;s.a+=.41;const n=12+E.ph*3;for(let i=0;i<n;i++){const a=s.a+i/n*6.283;mk(BC.x,BC.y,Math.cos(a)*112,Math.sin(a)*112,6,i*360/n)}}
 if(id===1&&s.c<=0){s.c=1.3/(1+E.ph*.12);const n=3+(E.ph>1);for(let i=0;i<n;i++){const v=Math.random()<.5;LZ.push({v,p:i===0?(v?heart.x:heart.y):(v?rnd(bx+10,bx+bw-10):rnd(by+10,by+bh-10)),t:0})}}
 if(id===2&&s.c<=0){s.c=.06/d;s.a+=.34;for(let k=0;k<3;k++){const a=s.a+k*2.094;mk(BC.x,BC.y,Math.cos(a)*122,Math.sin(a)*122,5,s.a*70+k*120)}}
 if(id===3){if(s.c<=0){s.c=.12/d;mk(rnd(bx,bx+bw),by-10,0,rnd(150,230),6,rnd(0,360))}
  s.n-=dt;if(s.n<=0){s.n=1.5;const L=Math.random()<.5,g=Math.floor(rnd(0,4));for(let i=0;i<5;i++){if(i===g||i===g+1)continue;mk(L?bx-12:bx+bw+12,by+14+i*28,(L?1:-1)*(120+E.ph*15),0,8,i*60+tm*50)}}}
 if(id===4&&s.c<=0){s.c=.85;mk(BC.x+rnd(-60,60),BC.y+20,0,rnd(60,100),8,rnd(0,360),{home:1.9,sp:125+E.ph*10})}
 if(id===5){if(!s.n){s.n=1;for(let i=0;i<4;i++){const a=rnd(0,6.283);mk(rnd(bx+30,bx+bw-30),rnd(by+30,by+bh-30),Math.cos(a)*150,Math.sin(a)*150,12,i*90,{bounce:1,life:atk.dur})}}
  if(s.c<=0){s.c=1.5;for(let i=0;i<8;i++){const a=i*.785+s.a;mk(BC.x,BC.y,Math.cos(a)*105,Math.sin(a)*105,6,i*45)}s.a+=.3}}
}
function updAtk(dt){atk.t+=dt;if(atk.t<atk.dur-.6)atk.ps.forEach(id=>runPat(id,dt));
 let mx=0,my=0;if(keys.ArrowLeft)mx--;if(keys.ArrowRight)mx++;if(keys.ArrowUp)my--;if(keys.ArrowDown)my++;if(mx&&my){mx*=.707;my*=.707}
 heart.x=Math.max(box.x+13,Math.min(box.x+box.w-13,heart.x+mx*150*dt));heart.y=Math.max(box.y+13,Math.min(box.y+box.h-13,heart.y+my*150*dt));
 P.inv=Math.max(0,P.inv-dt);
 for(const b of B){b.life-=dt;if(b.home>0){b.home-=dt;const dx=heart.x-b.x,dy=heart.y-b.y,l=Math.hypot(dx,dy)||1;b.vx+=(dx/l*b.sp-b.vx)*dt*3;b.vy+=(dy/l*b.sp-b.vy)*dt*3}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.bounce){if(b.x<box.x+b.r||b.x>box.x+box.w-b.r)b.vx*=-1;if(b.y<box.y+b.r||b.y>box.y+box.h-b.r)b.vy*=-1}
  if(Math.hypot(b.x-heart.x,b.y-heart.y)<b.r+3)hurt()}
 B=B.filter(b=>b.life>0&&b.x>-40&&b.x<680&&b.y>-60&&b.y<540);
 for(const l of LZ){l.t+=dt;if(l.t>.75&&l.t<1.1&&(l.v?Math.abs(heart.x-l.p)<13:Math.abs(heart.y-l.p)<13))hurt()}
 LZ=LZ.filter(l=>l.t<1.15);
 if(S==='attack'&&atk.t>atk.dur){B=[];LZ=[];toMenu()}
}
function update(dt){
 if(hs>0){hs-=dt;return}if(slow>0){slow-=dt;dt*=.25}zm*=Math.pow(.0005,dt);tm+=dt;ban.t-=dt;shk=Math.max(0,shk-dt);flash=Math.max(0,flash-dt*1.6);hf=Math.max(0,hf-dt);
 if(E){E.shake=Math.max(0,E.shake-dt);E.hpT=Math.max(0,E.hpT-dt);if(E.gone)E.gone+=dt}
 for(const p of PT){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.ring?0:60)*dt;p.l-=dt;if(p.ring)p.r+=p.vr*dt}PT=PT.filter(p=>p.l>0);
 if(S==='say'||S==='menu'){T.i=Math.min(T.s.length,T.i+dt*38);if(Math.floor(T.i)%3===0&&!tdone())beep(rnd(190,220),.03,'square',.012)}
 const tg=S==='attack'?AB:BX,k=Math.min(1,dt*14);for(const q in BX)box[q]+=(tg[q]-box[q])*k;
 if(S==='title'){if(OK()){prologue();beep(520,.1)}}
 else if(S==='say'){if(OK()){if(!tdone())T.i=T.s.length;else nextL()}}
 else if(S==='menu'){
  if(!sub){if(hit('ArrowLeft')){menu=(menu+2)%3;beep(330,.04)}if(hit('ArrowRight')){menu=(menu+1)%3;beep(330,.04)}
   if(OK()){beep(660,.06);if(menu===0){S='fight';fb={x:box.x+14,go:1}}
    else if(menu===1){focus=1;say(['당신은 숨을 고르고 집중했다.','다음 공격이 짧아진다!'],enemyTurn)}
    else if(inv.length){sub=true;subSel=0}}}
  else{if(NO())sub=false;else if(OK()){const it=inv[0];P.hp=Math.min(P.max,P.hp+it.h);beep(880,.15,'triangle',.06,400);
    say([`${it.n}을(를) 먹었다.`,`HP를 ${it.h} 회복했다!`],enemyTurn);if(--it.c<=0)inv.shift()}}}
 else if(S==='fight'&&fb.go){fb.x+=440*dt;
  if(fb.x>box.x+box.w-14){fb.go=0;fx={t:0,d:0,miss:1};S='fx'}
  else if(OK()){fb.go=0;const d=Math.abs(fb.x-(box.x+box.w/2))/((box.w-28)/2),n=Math.round(95*Math.pow(1-d,1.3))+6;fx={t:0,d:n,crit:d<.06,r:d<.06?'PERFECT':d<.25?'GREAT':d<.55?'GOOD':'WEAK',ap:0};S='fx';noise(.12,.25);beep(900,.12,'sawtooth',.05,-700)}}
 else if(S==='fx'){fx.t+=dt;
  if(!fx.miss&&!fx.ap&&fx.t>.35){fx.ap=1;const o=E.ph;E.hp=Math.max(0,E.hp-fx.d);E.last=fx.d;E.shake=.8;E.hpT=2;shk=.45+(fx.crit?.3:0);burst(BC.x,BC.y,70+fx.d,tm*60,380);ring(BC.x,BC.y,tm*80,700,.5);hs=.07+(fx.crit?.1:0)+Math.min(.1,fx.d/900);zm=fx.crit?.1:.06;noise(.3,.35);thud(90);beep(120,.3,'sawtooth',.08,-70);if(E.hp<=0){slow=.7;hs=.25;zm=.14;ring(BC.x,BC.y,200,900,.8)}
   E.ph=phase();if(E.hp>0&&E.ph>o){flash=1;shk=.7;ban={t:1.8,s:E.k?['','SPECTRUM','PRISM BREAK','OVERDRIVE'][E.ph]:'FRACTURE'};beep(70,.7,'sawtooth',.1,40);burst(BC.x,BC.y,120,tm*80,300)}}
  if(fx.t>1.5){if(E.hp<=0){burst(BC.x,BC.y,420,tm*60,520);for(let i=0;i<4;i++)setTimeout(()=>ring(BC.x,BC.y,i*90,800,.9),i*120);E.gone=.001;flash=1;shk=1.2;zm=.15;beep(60,1,'sawtooth',.12,-30);say(E.k?['PRISMA의 빛이 산산이 부서졌다.','당신은 모든 색을 이겨냈다!']:['조각 파수꾼이 무너졌다.'],afterWin)}else enemyTurn()}}
 else if(S==='talk'){talk.t+=dt;if(talk.t>1.9||(talk.t>.6&&OK()))startAtk()}
 else if(S==='attack')updAtk(dt);
 else if(S==='scene')updScene(dt);else if(S==='end'){if(OK())S='title'}
 else if(S==='dead'){dead.t+=dt;if(dead.t>3&&OK())reset()}
 else if(S==='over'){if(OK())reset()}
}

/* ---------- drawing ---------- */
function txt(s,x,y,sz=22,col='#fff',al='left'){X.font=sz+'px '+F;X.fillStyle=col;X.textAlign=al;X.textBaseline='middle';X.fillText(s,x,y)}
function wrap(s,w,sz=24){X.font=sz+'px '+F;const o=[];let l='';for(const ch of s){if(X.measureText(l+ch).width>w){o.push(l);l=ch}else l+=ch}o.push(l);return o}
function heartD(x,y,c='#f00',s=8){X.fillStyle=c;X.beginPath();X.moveTo(x,y+s*.9);X.bezierCurveTo(x-s*1.7,y-s*.1,x-s*.8,y-s*1.2,x,y-s*.35);X.bezierCurveTo(x+s*.8,y-s*1.2,x+s*1.7,y-s*.1,x,y+s*.9);X.fill()}
function poly(n,r,rot){X.beginPath();for(let i=0;i<n;i++){const a=rot+i/n*6.283;i?X.lineTo(Math.cos(a)*r,Math.sin(a)*r):X.moveTo(Math.cos(a)*r,Math.sin(a)*r)}X.closePath()}
function bg(){
 X.fillStyle='#06020f';X.fillRect(-10,-10,660,500);const hu=tm*45;
 X.globalCompositeOperation='lighter';
 for(let i=0;i<12;i++){const a=tm*.2*(1+E.ph*.5)+i*.5236;X.fillStyle=hsl(hu+i*30,50,.045+E.ph*.015);X.beginPath();X.moveTo(BC.x,BC.y);X.lineTo(BC.x+Math.cos(a)*900,BC.y+Math.sin(a)*900);X.lineTo(BC.x+Math.cos(a+.26)*900,BC.y+Math.sin(a+.26)*900);X.fill()}
 X.strokeStyle=hsl(hu+180,50,.18);X.lineWidth=1;const o=(tm*40)%40;
 for(let y=-40+o;y<250;y+=40){X.beginPath();X.moveTo(0,y);X.lineTo(640,y);X.stroke()}
 for(let x=0;x<=640;x+=40){X.beginPath();X.moveTo(x,0);X.lineTo(x,250);X.stroke()}
 X.globalCompositeOperation='source-over';
}
function boss(){
 if(E.gone)return;const sh=E.shake>0?Math.sin(tm*80)*E.shake*16:0,bob=Math.sin(tm*1.8)*7-E.shake*24,hu=tm*70,sp=1+E.ph*.5;
 bossBody(sh,bob,hu,sp);if(0){X.save();X.translate(BC.x+sh,BC.y+bob);X.globalCompositeOperation='lighter';X.shadowBlur=24;
 for(let i=0;i<6;i++){X.shadowColor=hsl(hu+i*50);X.strokeStyle=hsl(hu+i*50,62);X.lineWidth=4;poly(i%2?6:3+(i%3),84-i*11,tm*sp*(i%2?1:-1)*(.5+i*.15));X.stroke()}
 for(let i=0;i<7;i++){const a=tm*1.3*sp+i*.8976,x=Math.cos(a)*118,y=Math.sin(a)*46;X.save();X.translate(x,y);X.rotate(a*2);X.fillStyle=hsl(hu+i*50,65);X.shadowColor=hsl(hu+i*50);poly(4,9,0);X.fill();X.restore()}
 X.shadowBlur=0;X.globalCompositeOperation='source-over';
 X.fillStyle='#fff';X.beginPath();X.ellipse(0,0,28,19,0,0,6.283);X.fill();
 const dx=heart.x-(BC.x),dy=heart.y-BC.y,l=Math.hypot(dx,dy)||1;
 X.fillStyle=hsl(hu+180,50);X.beginPath();X.arc(dx/l*8,dy/l*5,11,0,6.283);X.fill();X.fillStyle='#000';X.beginPath();X.arc(dx/l*9,dy/l*6,5,0,6.283);X.fill();
 X.restore();}
 // hp bar
 const bw=420,bx=110;X.fillStyle='#220';X.fillRect(bx-3,8,bw+6,16);
 const g=X.createLinearGradient(bx,0,bx+bw,0);for(let i=0;i<=6;i++)g.addColorStop(i/6,hsl(i*60+tm*80,55));
 X.fillStyle=g;X.fillRect(bx,11,bw*E.hp/E.max,10);X.fillStyle='#000';[.25,.5,.75].forEach(r=>X.fillRect(bx+bw*r-1,8,2,16));
 txt(E.name,bx-14,16,15,'#fff','right');
 if(E.hpT>0){const a=2-E.hpT,sc=a<.2?1+(.2-a)*7:1,m=!E.last,t=m?'MISS':String(E.last);X.save();X.translate(BC.x,BC.y-60-Math.min(a,.5)*70);X.scale(sc,sc);X.font='44px '+F;X.textAlign='center';X.textBaseline='middle';X.lineWidth=7;X.strokeStyle='#000';X.lineJoin='round';X.strokeText(t,0,0);X.fillStyle=m?'#999':E.last>=70?'#ffe14d':'#fff';X.fillText(t,0,0);X.restore()}
}
function drawUI(){
 txt('당신',40,408,18);txt('LV 19',118,408,18);txt('HP',215,408,14);
 X.fillStyle='#c00';X.fillRect(245,399,P.max*3,18);X.fillStyle='#ff0';X.fillRect(245,399,P.hp*3,18);txt(`${P.hp} / ${P.max}`,245+P.max*3+12,408,18);
 const L=['싸운다','집중','아이템'];
 for(let i=0;i<3;i++){const x=70+i*190,sel=menu===i&&(S==='menu'||S==='fight'||S==='fx'),c=sel?'#ffd400':'#ff7a00';
  X.lineWidth=3;X.strokeStyle=c;X.strokeRect(x+1.5,426.5,160,38);txt(L[i],x+90,445,20,c,'center');if(sel&&S==='menu'&&!sub)heartD(x+24,445,'#f00',7)}
}
function drawBox(){
 const hu=tm*120;X.fillStyle='#000';X.fillRect(box.x,box.y,box.w,box.h);X.lineWidth=5;X.strokeStyle=S==='attack'?hsl(hu,70):'#fff';
 if(S==='attack'){X.shadowBlur=16;X.shadowColor=hsl(hu)}X.strokeRect(box.x,box.y,box.w,box.h);X.shadowBlur=0;
 if(S==='say'||(S==='menu'&&!sub))wrap(T.s.slice(0,Math.floor(T.i)),box.w-50).forEach((l,i)=>txt(l,box.x+24,box.y+32+i*32,24));
 if(S==='menu'&&sub){const it=inv[0];txt('* '+it.n+(it.c>1?' ×'+it.c:''),box.x+70,box.y+34,24);heartD(box.x+40,box.y+34,'#f00',8);txt('HP +'+it.h,box.x+70,box.y+68,16,'#999')}
 if(S==='fight'||(S==='fx'&&!fx.miss&&fx.t<.5)){const x0=box.x+14,w=box.w-28,c=box.y+box.h/2;
  X.fillStyle='#111';X.fillRect(x0,c-34,w,68);X.lineWidth=3;X.strokeStyle='#fff';X.strokeRect(x0,c-34,w,68);
